labels:
  # plain list: labels stack
  area:
    - extension
    - hook
    - indexing
    - release
    - server
    - vef

  # values may carry the GitHub label color (6 hex digits) and description
  kind:
    - bug
    - cleanup
    - documentation
    - epic
    - feature
    - regression
    - test

  # mapping: a later /priority replaces any existing priority/* label
  priority:
    - backlog
    - critical-urgent
    - important-longterm
    - important-soon

  # the /label allowlist, applied verbatim without a prefix
  labels:
    - documentation
    - question

# needs-* labels: see the require_matching_label section below
require_matching_label:
  - regexp: ^kind/
    missing_label: needs-kind
    issues: true
    prs: true
    missing_comment: Please add a kind label with /kind.
  - regexp: ^area/
    missing_label: needs-area
    prs: true
    missing_comment: Please add an area label with /area.
    grace_period_duration: 5s

# the merge gate; these are the defaults (labels is [lgtm, approved] once the repository has OWNERS files)
tide:
  labels: [lgtm]
  missing_labels: [do-not-merge/*, needs-rebase, hold]
  merge_method: merge
  merge_on_events: true
  merge_queue: auto

# the label /hold applies; this is the default
hold:
  label: do-not-merge/hold

# reviewers requested from OWNERS files when a pull request opens
blunderbuss:
  request_count: 2
  max_request_count: 4
  exclude_approvers: true
  ignore_drafts: true
  ignore_authors: ['dependabot[bot]']

# /approve on repositories with OWNERS files; these are the defaults
approve:
  require_self_approval: false
  ignore_review_state: false
  lgtm_acts_as_approve: false

# /lgtm records the reviewed commit as a prow/lgtm commit status; this is the default
lgtm:
  bind_to_commit: true

# the sweep job evaluates the pull requests updated within this window; this is the default
sweep:
  lookback: 1h